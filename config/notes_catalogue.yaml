  - ref: F32-01
    output_form: Narrative paragraph
    tick_state: manual
    tb_keys:
    - trade_receivables
    - cash_and_equivalents
    - long_term_borrowings
    wording: |-
      Financial assets and financial liabilities are presented net in the statement of financial position only where the Company has a currently enforceable legal right to set off the recognised amounts and intends either to settle on a net basis or to realise the asset and settle the liability simultaneously.
    build_note: MANUAL. Relevant where intercompany balances are netted.
    requirement: |-
