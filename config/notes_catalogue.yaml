- key: cash_and_cash_equivalents
  heading: Cash and cash equivalents
  tick_state: always
  pieces:
  - ref: F7-06
    output_form: Narrative paragraph
    tick_state: always
    tb_keys:
    - cash_and_equivalents
    wording: |-
      Cash and cash equivalents comprise cash at bank and on hand, together with short-term deposits with an original maturity of three months or less that are readily convertible to known amounts of cash and subject to an insignificant risk of changes in value. For the purpose of the statement of cash flows, cash and cash equivalents are presented net of bank overdrafts repayable on demand where these form an integral part of the Company's cash management.
    build_note: Short policy paragraph.
    requirement: |-
      Disclose the policy adopted in determining the composition of cash and cash equivalents.
  - ref: F7-02
    output_form: Figure in note
    tick_state: always
    tb_keys:
    - cash_and_equivalents
    wording: |-
      Cash at bank and on hand | Fixed deposits | Cash and cash equivalents in the statement of cash flows
    build_note: Simple table; auto-populated from mapped cash accounts.
    requirement: |-
      Disclose the components of cash and cash equivalents and reconcile them to the equivalent items in the statement of financial position.
  - ref: F7-05
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - cash_and_equivalents
    wording: Cash and bank balances restricted in use
    build_note: Suppress unless a restricted cash account is mapped.
    requirement: |-
      Disclose the amount of cash and cash equivalent balances not available for use, with commentary.
- key: assets_held_for_sale
  heading: Assets held for sale
  tick_state: manual
  pieces:
  - ref: F105-01
    output_form: Narrative paragraph
    tick_state: manual
    tb_keys:
    - assets_held_for_sale
    wording: |-
      {ASSET} has been classified as held for sale following the directors' decision to dispose of it. The sale is expected to be completed within twelve months of the end of the reporting period and will be effected by way of an outright sale. The asset is measured at the lower of its carrying amount and fair value less costs to sell, and is presented separately from all other assets in the statement of financial position.
    build_note: MANUAL. Rare in SME sets.
    requirement: |-
      Describe non-current assets classified as held for sale, the facts and circumstances of the sale, and the expected manner and timing of disposal.
- key: share_capital
  heading: Share capital
  tick_state: always
  pieces:
  - ref: F1-33
    output_form: Narrative paragraph
    tick_state: always
    tb_keys:
    - share_capital
    wording: |-
      Proceeds from the issue of ordinary shares are recognised as share capital in equity. Incremental costs directly attributable to the issue of ordinary shares are deducted against share capital.
    build_note: Short policy sub-section. Pairs with the share capital supporting note.
    requirement: |-
      Disclose the policy for share capital, being that proceeds from the issue of ordinary shares are recognised in equity and incremental costs directly attributable to the issue are deducted against share capital.
  - ref: F32-02
    output_form: Narrative paragraph
    tick_state: manual
    tb_keys:
    - share_capital
    - long_term_borrowings
    - short_term_borrowings
    wording: |-
      The Company's redeemable preference shares are classified as a financial liability because the Company has no unconditional right to avoid delivering cash on redemption. Distributions on these shares are recognised as interest expense in profit or loss.
    build_note: Rare but material when present.
    requirement: |-
      Disclose the classification of instruments as financial liabilities or equity, including any redeemable preference shares.
  - ref: F1-14
    output_form: Table
    tick_state: always
    tb_keys:
    - share_capital
    wording: Issued and fully paid ordinary shares | Number of shares | Amount
    build_note: Singapore companies have no par value.
    requirement: |-
      For each class of share capital, disclose the number of shares authorised, the number issued and fully paid and issued but not fully paid, par value or that the shares have no par value, a reconciliation of shares outstanding at the beginning and end of the period, the rights, preferences and restrictions attaching, shares held by the entity or its subsidiaries or associates, and shares reserved for issue under options and contracts for sale.
- key: reserves
  heading: Reserves
  tick_state: tb_driven
