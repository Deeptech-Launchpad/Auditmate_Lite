# The FRS notes catalogue for a single-entity Singapore Pte Ltd.
#
# Generated from AuditMate_FullFRS_Disclosure_Requirements_1.xlsx, supplied
# 2026-08-31. DRAFT per that file's own header - not yet reviewed by a
# qualified Singapore practitioner. Ref column preserved as `ref` below;
# never renumber a ref, it is the stable key the whole engine keys against.
#
# tick_state: always | tb_driven | manual
#   always     - every engagement, cannot be unticked from here.
#   tb_driven  - pre-ticked when any of trigger_keys carries a balance in
#                EITHER this year or last year; hidden otherwise.
#   manual     - unticked by default; the preparer opts in.
# A piece's own tick_state can be stricter than its parent note's (a
# TB-driven note can still hold a Manual piece that only appears if the
# preparer opts into it specifically).
#
# output_form: narrative_paragraph | table | figure_in_note (drives which
# editor the preparer sees for that piece).
#
# Numbering is NOT stored here. It is generated at render time from
# whichever notes are enabled, in the order this file lists them - see
# services/reports.py:note_number_map().
#
# Nine tb_driven items have no resolvable trigger_keys (contingent
# liabilities, commitments, non-cash transactions, dividends, related party
# transactions/balances, FX risk, concentration of risk, events after the
# reporting period) - a trial balance account name alone cannot reveal these.
# They default OFF like a Manual item until a better signal exists.

- key: corporate_information
  heading: Corporate information
  tick_state: always
  pieces:
  - ref: CA-STRUCT-01
    output_form: Narrative paragraph
    tick_state: always
    wording: |-
      The Company is a private limited company incorporated and domiciled in the Republic of Singapore under the Companies Act.

      The registered office is located at {{ customer.address }}.

      The principal activities of the Company are those of <em>[describe principal activities]</em>. There have been no significant changes in these activities during the period.

      The financial statements were approved and authorised for issue by the board of directors on the same date as per the directors' statement.
    build_note: Structural, not in the 74-note tick list (a Companies Act requirement, not an FRS disclosure) - carried over unchanged from the existing template so it keeps first position.
    requirement: State what the Company is, where it is registered, and what it does.

- key: material_accounting_policy_information
  heading: Material accounting policy information
  tick_state: always
  pieces:
  - ref: F1-07
    output_form: Narrative paragraph
    tick_state: always
    wording: |-
      The accounting policies set out below have been applied consistently to all periods presented in these financial statements. Only accounting policy information that is material to an understanding of these financial statements has been disclosed.
    build_note: This is the anchor for the whole policies section and for suppression logic.
    requirement: Disclose material accounting policy information.
  - ref: F1-08
    output_form: Narrative paragraph
    tick_state: always
    wording: |-
      Accounting policy information relating to transactions, other events or conditions that are not material to the Company has not been disclosed, so that material information is not obscured by immaterial information.
    build_note: Authority for TB-driven suppression. Cite with FRS PS 2 paras 88B-88G.
    requirement: |-
      Omit accounting policy information relating to immaterial transactions, events or conditions, and do not let immaterial policy information obscure material policy information.
  subsections:
  - key: basis_of_preparation
    heading: Basis of preparation
    tick_state: always
    pieces:
    - ref: F1-01
      output_form: Narrative paragraph
      tick_state: always
      wording: |-
        The financial statements have been prepared in accordance with the provisions of the Companies Act 1967 and Financial Reporting Standards in Singapore ("FRS").
      build_note: Opening compliance note. Wording must say FRS, not SFRS(I).
      requirement: |-
        State explicitly and without qualification that the financial statements comply with Financial Reporting Standards in Singapore.
  - key: going_concern
    heading: Going concern
    tick_state: always
    pieces:
    - ref: F1-06
      output_form: Narrative paragraph
      tick_state: always
      wording: |-
        The financial statements have been prepared on a going concern basis. The directors have assessed the Company's ability to continue in operation for at least twelve months from the date these financial statements are authorised for issue, taking into account its cash flow forecasts and the continued support of its shareholders, and are satisfied that the Company has adequate resources to continue in operational existence for the foreseeable future.
      build_note: Base paragraph always on. Material uncertainty paragraph is MANUAL.
      requirement: |-
        Confirm the going concern basis, and where material uncertainties exist, disclose them.
  - key: changes_in_accounting_policies
    heading: Changes in accounting policies
    tick_state: manual
    pieces:
    - ref: F8-03
      output_form: Narrative paragraph
      tick_state: manual
      wording: |-
        During the financial year the Company changed its accounting policy for {SUBJECT}. The directors consider that the new policy provides reliable and more relevant information about the effect of the transactions concerned on the Company's financial position and financial performance. The change has been applied retrospectively and the comparative figures have been restated accordingly.
      build_note: MANUAL trigger only.
      requirement: |-
        For a voluntary change in accounting policy, disclose the nature, the reason the new policy is more reliable and relevant, and the amount of the adjustment for each line item affected.
  - key: new_and_amended_standards_adopted
    heading: New and amended standards adopted
    tick_state: always
    pieces:
    - ref: F8-01
      output_form: Figure in note
      tick_state: always
      wording: Standard | Effect on the financial statements
      build_note: Annual maintenance item. Table refreshed each year as amendments bite.
      requirement: |-
        On initial application of a standard, disclose its title, the nature of the change and the effect on the current and prior periods.
  - key: standards_issued_but_not_yet_effective
    heading: Standards issued but not yet effective
    tick_state: always
    pieces:
    - ref: F8-02
      output_form: Figure in note
      tick_state: always
      wording: Standard | Effective for annual periods beginning on or after
      build_note: Annual maintenance item. Highest-churn note in the library.
      requirement: |-
        Disclose standards issued but not yet effective that have not been early adopted, with known or reasonably estimable information about their likely impact.
  - key: functional_and_presentation_currency
    heading: Functional and presentation currency
    tick_state: always
    pieces:
    - ref: F21-01
      output_form: Narrative paragraph
      tick_state: always
      wording: |-
        The financial statements are presented in Singapore Dollars, which is also the Company's functional currency, and all values are rounded to the nearest dollar unless otherwise stated.
      build_note: Usually SGD both; conditional paragraph where different.
      requirement: |-
        Disclose the functional currency and, where it differs from the presentation currency, the reason for using a different presentation currency.
  - key: foreign_currency_translation
    heading: Foreign currency translation
    tick_state: always
    pieces:
    - ref: F21-02
      output_form: Narrative paragraph
      tick_state: always
      tb_keys:
      - cash_and_equivalents
      wording: |-
        Transactions in currencies other than the Company's functional currency are translated into the functional currency at the exchange rates prevailing at the dates of the transactions. At the end of each reporting period, monetary assets and liabilities denominated in foreign currencies are retranslated at the exchange rates prevailing at that date. Non-monetary items measured at historical cost are not retranslated. Exchange differences arising on settlement or on retranslation are recognised in profit or loss.
      build_note: Suppress where no foreign currency balances or transactions.
      requirement: |-
        Disclose the policy for translating foreign currency transactions and monetary and non-monetary balances.
  - key: impairment_of_non_financial_assets
    heading: Impairment of non-financial assets
    tick_state: tb_driven
    trigger_keys:
    - trade_receivables
    pieces:
    - ref: F36-01
      output_form: Figure in note
      tick_state: tb_driven
      tb_keys:
      - trade_receivables
      wording: Impairment loss recognised, and the line item in which it is included
      build_note: Suppress where no impairment charge.
      requirement: |-
        Disclose the amount of impairment losses recognised in profit or loss and the line item in which they are included.
    - ref: F36-02
      output_form: Figure in note
      tick_state: manual
      tb_keys:
      - trade_receivables
      wording: Reversal of impairment loss recognised
      build_note: Rare.
      requirement: |-
        Disclose the amount of reversals of impairment losses recognised in profit or loss and the line item affected.
    - ref: F36-03
      output_form: Figure in note
      tick_state: tb_driven
      tb_keys:
      - trade_receivables
      wording: Carrying amount before impairment | Impairment loss | Recoverable amount
      build_note: MANUAL narrative.
      requirement: |-
        For a material impairment, disclose the events and circumstances that led to it, the amount, and the basis on which recoverable amount was determined.
    - ref: F36-04
      output_form: Figure in note
      tick_state: manual
      tb_keys:
      - trade_receivables
      wording: Recoverable amount | Basis of measurement | Discount rate applied
      build_note: See FRS PS 2 Example T on suppressing boilerplate impairment policy.
      requirement: |-
        Disclose the recoverable amount of the asset or cash-generating unit and whether it is fair value less costs of disposal or value in use, and where value in use is used, the discount rate applied in the current and previous estimates.
  - key: financial_instruments
    heading: Financial instruments
    tick_state: always
    pieces:
    - ref: F109-01
      output_form: Narrative paragraph
      tick_state: always
      tb_keys:
      - trade_receivables
      - cash_and_equivalents
      wording: |-
        Financial assets are classified at initial recognition on the basis of the Company's business model for managing them and their contractual cash flow characteristics. The Company's financial assets comprise trade and other receivables and cash and bank balances, all of which are held within a business model whose objective is to collect contractual cash flows, and whose contractual terms give rise on specified dates to cash flows that are solely payments of principal and interest. These assets are accordingly measured at amortised cost using the effective interest method, less any loss allowance.
      build_note: Core policy note. See FRS PS 2 para 88F(a) on standardised policy text.
      requirement: |-
        Disclose the policy for classifying and measuring financial assets, reflecting the business model for managing them and their contractual cash flow characteristics.
    - ref: F109-02
      output_form: Narrative paragraph
      tick_state: always
      tb_keys:
      - trade_receivables
      - cash_and_equivalents
      - long_term_borrowings
      wording: |-
        A financial asset is derecognised when the contractual rights to the cash flows from the asset expire, or when the asset is transferred and substantially all the risks and rewards of ownership pass to the transferee. A financial liability is derecognised when the obligation under the liability is discharged, cancelled or expires. Any difference between the carrying amount derecognised and the consideration received or paid is recognised in profit or loss.
      build_note: Candidate for suppression where no derecognition events occurred.
      requirement: Disclose the policy for derecognition of financial assets and liabilities.
  - key: impairment_of_financial_assets
    heading: Impairment of financial assets
    tick_state: always
    pieces:
    - ref: F109-03
      output_form: Narrative paragraph
      tick_state: always
      tb_keys:
      - trade_receivables
      wording: |-
        The Company recognises a loss allowance for expected credit losses on financial assets measured at amortised cost. A financial asset is considered to be in default when the counterparty fails to make a contractual payment within 90 days of the date on which it falls due, or when information becomes available indicating that the counterparty is unlikely to pay its obligations in full. Financial assets are written off when there is no reasonable expectation of recovery, and amounts subsequently recovered are recognised in profit or loss.
      build_note: Simplified approach for trade receivables in virtually all SME sets.
      requirement: |-
        Disclose the expected credit loss approach applied, whether the simplified or general approach, the definition of default and the write-off policy.
  - key: loss_allowance
    heading: Loss allowance
    tick_state: manual
    pieces:
    - ref: F107-22
      output_form: Figure in note
      tick_state: manual
      tb_keys:
      - trade_receivables
      - cash_and_equivalents
      wording: |-
        Loss allowance on financial assets measured at fair value through other comprehensive income
      build_note: Rare in SME sets but a presentation trap where FVOCI assets exist.
      requirement: |-
        Where financial assets are measured at fair value through other comprehensive income, do not reduce the carrying amount by the loss allowance or present the allowance separately in the statement of financial position, but disclose the loss allowance in the notes.
    - ref: F107-09
      output_form: Table
      tick_state: tb_driven
      tb_keys:
      - trade_receivables
      wording: 'Loss allowance: at 1 January, charge for the year, written off, at 31 December'
      build_note: 'Table shape: opening, charge, write-off, closing.'
      requirement: |-
        Provide a reconciliation of the loss allowance from the opening to the closing balance, by class of financial instrument.
  - key: government_grants
    heading: Government grants
    tick_state: tb_driven
    trigger_keys:
    - other_income
    pieces:
    - ref: F20-01
      output_form: Narrative paragraph
      tick_state: tb_driven
      tb_keys:
      - other_income
      wording: |-
        Government grants are recognised only when there is reasonable assurance that the Company will comply with the conditions attaching to them and that the grants will be received. Grants that compensate the Company for expenses incurred are recognised in profit or loss on a systematic basis over the periods in which the related expenses are recognised, and are presented within other income.
      build_note: Relevant for Singapore wage and training support schemes.
      requirement: |-
        Disclose the accounting policy for government grants, including the method of presentation adopted.
    - ref: F20-02
      output_form: Narrative paragraph
      tick_state: tb_driven
      tb_keys:
      - other_income
      wording: |-
        During the financial year the Company recognised government grants of ${AMOUNT} (previous year: ${AMOUNT}) under government support schemes. There are no unfulfilled conditions or other contingencies attaching to these grants.
      build_note: Suppress where no grant income account is mapped.
      requirement: |-
        Disclose the nature and extent of grants recognised, and any unfulfilled conditions or contingencies attaching.
  - key: comparative_information
    heading: Comparative information
    tick_state: manual
    pieces:
    - ref: F1-21
      output_form: Narrative paragraph
      tick_state: manual
      wording: |-
        Certain comparative figures have been reclassified to conform with the current year's presentation. The reclassification has no effect on the profit reported for the previous financial year or on total equity at the end of that year.
      build_note: MANUAL trigger only.
      requirement: |-
        Where comparative amounts are reclassified, disclose the nature, amount and reason for the reclassification.
  - key: goods_and_services_tax
    heading: Goods and services tax
    tick_state: always
    pieces:
    - ref: F1-32
      output_form: Narrative paragraph
      tick_state: always
      wording: |-
        Revenue, expenses and assets are recognised net of goods and services tax, except where the goods and services tax incurred on a purchase of assets or services is not recoverable from the taxation authority, in which case it is recognised as part of the cost of acquisition of the asset or as part of the expense item. Receivables and payables are stated inclusive of goods and services tax. The net amount recoverable from, or payable to, the taxation authority is included within receivables or payables in the statement of financial position.
      build_note: Singapore-specific policy sub-section. Appears in observed practice but has no direct
        FRS paragraph of its own; sits under the material accounting policy requirement.
      requirement: |-
        Disclose the policy for accounting for goods and services tax, being that revenue, expenses and assets are recognised net of GST except where the GST incurred is not recoverable from the taxation authority, and that the net amount recoverable from or payable to the authority is included within receivables or payables.
- key: significant_accounting_judgements_and_estimates
  heading: Significant accounting judgements and estimates
  tick_state: always
  pieces:
  - ref: F1-31
    output_form: Narrative paragraph
    tick_state: always
    wording: |-
      The preparation of financial statements requires management to exercise judgement in applying the Company's accounting policies, and to make estimates and assumptions about the future. The judgements and estimates considered most significant are set out below.
    build_note: Container note. Carries a short lead-in; the judgements and estimates disclosures sit
      under it as sub-sections.
    requirement: |-
      Disclose the judgements and the estimation uncertainties that management has applied in preparing the financial statements.
  subsections:
  - key: critical_judgements_in_applying_accounting_policies
    heading: Critical judgements in applying accounting policies
    tick_state: always
    pieces:
    - ref: F1-09
      output_form: Narrative paragraph
      tick_state: always
      wording: |-
        In applying the Company's accounting policies, management has made judgements which have a significant effect on the amounts recognised in these financial statements. The judgement considered most significant is the assessment of whether the Company acts as principal or agent in its revenue arrangements, which determines whether revenue is recognised gross or net of amounts payable to suppliers. Management has concluded that the Company acts as principal because it controls the goods or services before they are transferred to the customer, bears the inventory risk and has discretion in establishing prices.
      build_note: Judgements section. Pre-tick a default set, allow manual add.
      requirement: |-
        Disclose the judgements management made in applying accounting policies that have the most significant effect on recognised amounts.
    - ref: F115-07
      output_form: Narrative paragraph
      tick_state: always
      wording: |-
        In determining the amount and timing of revenue recognition, management has made judgements as to the point at which control of the goods transfers to the customer, and as to the method used to measure progress towards complete satisfaction of performance obligations that are satisfied over time.
      build_note: Links to the judgements section under FRS 1 para 122.
      requirement: |-
        Disclose the significant judgements made in determining the timing of satisfaction of performance obligations and the transaction price.
  - key: key_sources_of_estimation_uncertainty
    heading: Key sources of estimation uncertainty
    tick_state: always
    pieces:
    - ref: F1-10
      output_form: Narrative paragraph
      tick_state: always
      wording: |-
        The preparation of financial statements requires management to make estimates and assumptions that affect the reported amounts of assets, liabilities, income and expenses. Estimates and underlying assumptions are reviewed on an ongoing basis, and revisions are recognised in the period in which the estimate is revised. The key sources of estimation uncertainty at the end of the reporting period that carry a significant risk of resulting in a material adjustment to the carrying amounts of assets and liabilities within the next financial year are the estimation of the useful lives of property, plant and equipment and the measurement of the allowance for expected credit losses on trade receivables.
      build_note: 'Estimates section. Typical set: useful lives, ECL, inventory provision, tax.'
      requirement: |-
        Disclose assumptions about the future and other major sources of estimation uncertainty carrying a significant risk of material adjustment within the next year.
- key: revenue
  heading: Revenue
  tick_state: always
  pieces:
  - ref: F115-02
    output_form: Narrative paragraph
    tick_state: always
    tb_keys:
    - revenue
    wording: |-
      Revenue from the sale of goods is recognised when the Company satisfies its performance obligation by transferring control of the goods to the customer, which occurs on delivery. Payment is due within 60 days of invoicing. Revenue from the rendering of services is recognised as the services are performed and the customer simultaneously receives and consumes the benefits provided, with payment due within 30 days of invoicing.
    build_note: Entity-specific wording required; boilerplate is a known reviewer flag.
    requirement: |-
      For each major revenue stream, describe the nature of the goods or services, when performance obligations are satisfied, and the significant payment terms.
  - ref: F115-03
    output_form: Narrative paragraph
    tick_state: always
    tb_keys:
    - revenue
    wording: |-
      Revenue from the sale of goods is recognised at the point in time at which control of the goods transfers to the customer. Revenue from the rendering of services is recognised over time, with progress towards complete satisfaction of the performance obligation measured by reference to the services performed to date as a proportion of the total services to be performed under the contract.
    build_note: Drives the disaggregation table's timing split.
    requirement: |-
      Disclose whether revenue is recognised at a point in time or over time and, where over time, the method used to measure progress.
  - ref: F115-10
    output_form: Narrative paragraph
    tick_state: manual
    wording: |-
      The Company has applied the practical expedient available under FRS 115 and has not disclosed the transaction price allocated to remaining performance obligations for contracts with an original expected duration of one year or less.
    build_note: Commonly the one-year expedient on remaining performance obligations.
    requirement: Disclose which practical expedients have been applied.
  - ref: F115-01
    output_form: Table
    tick_state: always
    tb_keys:
    - revenue
    wording: |-
      Types of goods and services | Timing of transfer: at a point in time, over time | Total revenue
    build_note: 'Table shape: by revenue stream, by timing of transfer.'
    requirement: |-
      Disaggregate revenue into categories depicting how the nature, amount, timing and uncertainty of revenue and cash flows are affected by economic factors.
- key: contract_balances
  heading: Contract balances
  tick_state: tb_driven
  trigger_keys:
  - contract_assets
  - contract_liabilities
  pieces:
  - ref: F115-04
    output_form: Narrative paragraph
    tick_state: tb_driven
    tb_keys:
    - contract_assets
    - contract_liabilities
    wording: |-
      Contract liabilities represent consideration received from customers in advance of the Company satisfying the related performance obligations, and are recognised as revenue when those obligations are satisfied. Contract assets represent the Company's right to consideration for work performed but not yet billed at the end of the reporting period.
    build_note: Suppress where no contract asset or liability accounts are mapped.
    requirement: |-
      Disclose the opening and closing balances of receivables, contract assets and contract liabilities, and explain significant changes.
  - ref: F115-05
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - contract_liabilities
    wording: |-
      Revenue recognised that was included in the contract liability balance at the beginning of the year
    build_note: Derived by comparing the opening contract liability with the amount released to revenue
      in the period.
    requirement: |-
      Disclose revenue recognised in the period that was included in the contract liability balance at the beginning of the period.
- key: contract_costs
  heading: Contract costs
  tick_state: manual
  pieces:
  - ref: F115-09
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - contract_assets
    wording: |-
      Costs to obtain a contract | Costs to fulfil a contract | Amortisation for the year | Closing balance
    build_note: Rare.
    requirement: |-
      Disclose costs capitalised to obtain or fulfil a contract, the amortisation method and the closing balance by asset type.
- key: remaining_performance_obligations
  heading: Remaining performance obligations
  tick_state: manual
  pieces:
  - ref: F115-06
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - contract_liabilities
    wording: |-
      Transaction price allocated to remaining performance obligations | Expected timing of recognition
    build_note: Practical expedients often available; see F115-10.
    requirement: |-
      Disclose the transaction price allocated to remaining performance obligations and when it is expected to be recognised as revenue.
- key: other_income
  heading: Other income
  tick_state: tb_driven
  trigger_keys:
  - other_income
  - trade_receivables
  pieces:
  - ref: F21-03
    output_form: Figure in note
    tick_state: tb_driven
    tb_keys:
    - other_income
    wording: Net foreign exchange gain or loss
    build_note: Auto-populated from mapped FX accounts.
    requirement: Disclose the amount of exchange differences recognised in profit or loss.
  - ref: F107-04
    output_form: Figure in note
    tick_state: tb_driven
    wording: Net gains or losses on financial assets at amortised cost
    build_note: Often immaterial in an SME set; candidate for suppression.
    requirement: |-
      Disclose net gains or losses on each category of financial asset and financial liability.
  - ref: F107-06
    output_form: Figure in note
    tick_state: tb_driven
    tb_keys:
    - trade_receivables
    wording: Net gains or losses on financial assets measured at amortised cost
    build_note: The impairment line requirement is FRS 1 para 82(ba) - see PS-PL-08 - and the allowance
      reconciliation is FRS 107 para 35H.
    requirement: Disclose net gains or net losses on financial assets measured at amortised cost.
- key: administrative_and_other_expenses
  heading: Administrative and other expenses
  tick_state: tb_driven
  trigger_keys:
  - depreciation
  - staff_salaries
  pieces:
  - ref: F1-17
    output_form: Figure in note
    tick_state: tb_driven
    tb_keys:
    - depreciation
    - staff_salaries
    wording: Depreciation | Amortisation | Employee benefits expense
    build_note: Conditional on the presentation format chosen at client level.
    requirement: |-
      Where expenses are presented by function, additionally disclose depreciation, amortisation and employee benefits expense.
- key: finance_costs
  heading: Finance costs
  tick_state: manual
  pieces:
  - ref: F23-01
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - interest_expense
    wording: Borrowing costs capitalised during the year
    build_note: Rare in SME sets. MANUAL.
    requirement: Disclose the amount of borrowing costs capitalised during the period.
  - ref: F23-02
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - interest_expense
    wording: Capitalisation rate applied
    build_note: MANUAL.
    requirement: |-
      Disclose the capitalisation rate used to determine borrowing costs eligible for capitalisation.
  - ref: F107-05
    output_form: Figure in note
    tick_state: tb_driven
    tb_keys:
    - interest_expense
    - interest_income
    wording: |-
      Interest income calculated using the effective interest method | Interest expense on financial liabilities not at fair value through profit or loss
    build_note: Wording tightened - the standard specifies the effective interest method and requires
      the asset amounts shown separately.
    requirement: |-
      Disclose total interest revenue and total interest expense calculated using the effective interest method for financial assets measured at amortised cost or at fair value through other comprehensive income, shown separately, and for financial liabilities not measured at fair value through profit or loss.
  - ref: F107-21
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - other_income
    wording: |-
      Fee income | Fee expense, other than amounts included in the effective interest rate
    build_note: Commonly bank charges and facility fees in an SME set.
    requirement: |-
      Disclose fee income and expense, other than amounts included in determining the effective interest rate, arising from financial assets and liabilities not at fair value through profit or loss.
  - ref: F116-03
    output_form: Figure in note
    tick_state: tb_driven
    tb_keys:
    - lease_liabilities
    wording: Interest expense on lease liabilities
    build_note: Feeds the FRS 116 para 54 lease table and the finance costs note. Do not double count
      between the two.
    requirement: Disclose interest expense on lease liabilities.
- key: profit_before_tax
  heading: Profit before tax
  tick_state: always
  pieces:
  - ref: F1-18
    output_form: Narrative paragraph
    tick_state: always
    wording: |-
      Included in administrative and other expenses is {ITEM} of ${AMOUNT} (previous year: ${AMOUNT}). The amount has been disclosed separately because of its size and nature.
    build_note: Manual identification; cannot be derived from TB alone.
    requirement: |-
      Separately disclose the nature and amount of material items of income or expense.
- key: income_tax_expense
  heading: Income tax expense
  tick_state: always
  pieces:
  - ref: F12-05
    output_form: Narrative paragraph
    tick_state: always
    wording: |-
      Income tax is calculated at the Singapore statutory rate of 17% of the estimated assessable profit for the financial year, after taking account of the partial tax exemption available to the Company under the Income Tax Act 1947.
    build_note: Singapore headline rate; update annually.
    requirement: |-
      Disclose the applicable tax rate used and explain any change from the previous period.
  - ref: F12-01
    output_form: Table
    tick_state: always
    wording: |-
      Current income tax | Under or over provision in respect of prior years | Deferred tax | Income tax expense
    build_note: 'Table shape: current year, under/over provision, deferred, total.'
    requirement: |-
      Disclose the major components of tax expense, including current tax, deferred tax and adjustments for prior periods.
  - ref: F12-02
    output_form: Table
    tick_state: always
    wording: |-
      Profit before tax | Tax at the statutory rate of 17% | Non-deductible expenses | Income not subject to tax | Tax exemption and rebates | Under or over provision in prior years | Income tax expense
    build_note: Include Singapore partial exemption and tax exemption for new companies.
    requirement: |-
      Provide a reconciliation between tax expense and the product of accounting profit and the applicable tax rate.
- key: deferred_tax_liabilities
  heading: Deferred tax liabilities
  tick_state: tb_driven
