- key: lease_liabilities
  heading: Lease liabilities
  tick_state: tb_driven
  trigger_keys:
  - lease_liabilities
  pieces:
  - ref: F116-12
    output_form: Narrative paragraph
    tick_state: tb_driven
    tb_keys:
    - lease_liabilities
    wording: |-
      At inception of a contract the Company assesses whether the contract is, or contains, a lease. The lease term comprises the non-cancellable period of the lease, together with periods covered by an option to extend the lease where the Company is reasonably certain to exercise that option and periods covered by an option to terminate the lease where the Company is reasonably certain not to exercise that option. Lease liabilities are measured at the present value of the lease payments remaining at the commencement date, discounted using the Company's incremental borrowing rate because the interest rate implicit in the lease is not readily determinable.
    build_note: Rate is a client-level input, not derivable from TB.
    requirement: |-
      Disclose the policy and judgements applied in determining the lease term and the incremental borrowing rate used.
  - ref: F116-09
    output_form: Table
    tick_state: tb_driven
    tb_keys:
    - lease_liabilities
    wording: |-
      Within 1 year | 1 to 5 years | More than 5 years | Total undiscounted lease payments | Lease liabilities recognised
    build_note: Must reconcile with the FRS 107 liquidity table.
    requirement: |-
      Provide a maturity analysis of lease liabilities separately from other financial liabilities.
