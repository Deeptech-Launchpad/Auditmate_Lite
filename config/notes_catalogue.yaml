      Disclose temporary differences associated with investments in subsidiaries for which no deferred tax liability has been recognised.
- key: property_plant_and_equipment
  heading: Property, plant and equipment
  tick_state: always
  pieces:
  - ref: F16-01
    output_form: Narrative paragraph
    tick_state: always
    tb_keys:
    - ppe
    wording: |-
      All items of property, plant and equipment are initially recorded at cost, comprising the purchase price and any costs directly attributable to bringing the asset to the location and condition necessary for it to operate in the manner intended by management. Subsequent to recognition, property, plant and equipment are measured at cost less accumulated depreciation and any accumulated impairment losses. Subsequent expenditure is capitalised only where it is probable that future economic benefits will flow to the Company and the cost can be measured reliably; all other repairs and maintenance are recognised in profit or loss as incurred. The carrying values of property, plant and equipment are reviewed for impairment whenever events or changes in circumstances indicate that the carrying value may not be recoverable.
    build_note: Cost model in almost all SME sets.
    requirement: Disclose the measurement bases used for determining gross carrying amount.
  - ref: F16-02
    output_form: Narrative paragraph
    tick_state: always
    tb_keys:
    - ppe
    wording: |-
      Depreciation of an asset begins when it is available for use and is computed on a straight-line basis over the estimated useful life of the asset, writing off its cost less any estimated residual value. Depreciation ceases at the earlier of the date the asset is classified as held for sale and the date it is derecognised. Fully depreciated assets are retained in the financial statements until they are no longer in use.
    build_note: Straight line in almost all SME sets.
    requirement: Disclose the depreciation methods used.
  - ref: F16-03
    output_form: Narrative + table
    tick_state: always
    tb_keys:
    - ppe
    wording: |-
      The estimated useful lives applied to each class of asset are set out below. Residual values, useful lives and depreciation methods are reviewed at the end of each reporting period and adjusted prospectively where expectations differ from previous estimates.
    build_note: 'Table shape: class, years. Client-level, carried forward.'
    requirement: Disclose the useful lives or depreciation rates used, by class of asset.
  - ref: F16-04
    output_form: Figure in note
    tick_state: always
    tb_keys:
    - ppe
    wording: |-
      Cost at the beginning and end of the year | Accumulated depreciation at the beginning and end of the year
    build_note: Part of the movement schedule.
    requirement: |-
      Disclose gross carrying amount and accumulated depreciation at the beginning and end of the period.
  - ref: F16-05
    output_form: Table
    tick_state: always
    tb_keys:
    - ppe
    wording: |-
      Cost: at 1 January, additions, disposals, write-offs, at 31 December | Accumulated depreciation: at 1 January, charge for the year, disposals, write-offs, at 31 December | Net carrying amount
    build_note: The single largest table in a typical SME set. Needs class-level TB detail.
    requirement: |-
      Provide a reconciliation of the carrying amount at the beginning and end of the period showing additions, disposals, depreciation, impairment and other movements.
  - ref: F16-08
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - other_income
    wording: Compensation received from third parties for items impaired or lost
    build_note: Rare.
    requirement: |-
      Disclose compensation from third parties for items impaired, lost or given up, where not presented separately.
  - ref: F16-10
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - ppe
    wording: Carrying amount of temporarily idle assets | Assets retired from active use
    build_note: Encouraged, not required, alongside para 79(b).
    requirement: |-
      Consider disclosing the carrying amount of temporarily idle assets, assets retired from active use and not held for sale, and where the cost model is used, the fair value of property, plant and equipment where materially different from carrying amount.
  - ref: F16-09
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - ppe
    wording: Gross carrying amount of fully depreciated assets still in use
    build_note: Encouraged, not required. Common in Singapore SME practice.
    requirement: |-
      Consider disclosing the gross carrying amount of fully depreciated assets still in use.
- key: investment_property
  heading: Investment property
  tick_state: manual
  pieces:
  - ref: F40-01
    output_form: Narrative paragraph
    tick_state: manual
    tb_keys:
    - investment_property
    wording: |-
      Investment property is measured initially at cost, including transaction costs. Subsequent to initial recognition, investment property is measured at cost less accumulated depreciation and any accumulated impairment losses, consistent with the accounting policy applied to property, plant and equipment.
    build_note: Model choice is client-level and locks the subsequent measurement for all investment property.
    requirement: Disclose whether the fair value model or the cost model is applied.
  - ref: F40-02
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - investment_property
    wording: Fair value | Valuation technique | Name and qualification of the valuer
    build_note: MANUAL.
    requirement: |-
      Where fair value is used, disclose the methods and significant assumptions applied, and the extent to which an independent professional valuer was involved.
  - ref: F40-03
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - other_income
    wording: |-
      Rental income from investment property | Direct operating expenses arising from investment property
    build_note: Rental income and the related direct operating expenses must be shown separately, not
      netted.
    requirement: |-
      Disclose rental income from investment property and the direct operating expenses arising from it.
  - ref: F40-04
    output_form: Table
    tick_state: manual
    tb_keys:
    - investment_property
    wording: At 1 January | Additions | Depreciation | At 31 December
    build_note: Reuse PPE movement table shape.
    requirement: |-
      Provide a reconciliation of the carrying amount of investment property at the beginning and end of the period.
- key: intangible_assets
  heading: Intangible assets
  tick_state: manual
  pieces:
  - ref: F38-01
    output_form: Narrative paragraph
    tick_state: manual
    tb_keys:
    - intangible_assets
    wording: |-
      Intangible assets acquired separately are measured at cost on initial recognition. Following initial recognition, intangible assets are carried at cost less accumulated amortisation and any accumulated impairment losses. The useful lives of the Company's intangible assets, which comprise computer software, are assessed as finite and are estimated to be three years.
    build_note: Commonly software licences in an SME set.
    requirement: |-
      For each class of intangible asset, disclose whether useful lives are finite or indefinite, and the useful lives or amortisation rates used.
  - ref: F38-02
    output_form: Narrative paragraph
    tick_state: manual
    tb_keys:
    - intangible_assets
    wording: |-
      Intangible assets with finite useful lives are amortised on a straight-line basis over their estimated useful lives. The amortisation charge is recognised in profit or loss within administrative and other expenses. The amortisation period and the amortisation method are reviewed at least at the end of each reporting period, and any change is accounted for prospectively as a change in an accounting estimate.
    build_note: Reuse the amortisation component of the PPE depreciation logic; the mechanics are identical.
    requirement: |-
      Disclose the amortisation methods used and the line item in which amortisation is included.
  - ref: F38-03
    output_form: Table
    tick_state: manual
    tb_keys:
    - intangible_assets
    wording: |-
      Cost: at 1 January, additions, at 31 December | Accumulated amortisation: at 1 January, charge for the year, at 31 December | Net carrying amount
    build_note: Same table shape as PPE movement schedule; reuse the component.
    requirement: |-
      Provide a reconciliation of the carrying amount at the beginning and end of the period.
- key: investments_in_subsidiaries
  heading: Investments in subsidiaries
  tick_state: manual
  pieces:
  - ref: F27-03
    output_form: Narrative paragraph
    tick_state: manual
    tb_keys:
    - investments
    wording: |-
      Investments in subsidiaries are stated in the Company's financial statements at cost less any accumulated impairment losses. The carrying amount of each investment is reviewed for impairment whenever events or changes in circumstances indicate that it may not be recoverable, and an impairment loss is recognised in profit or loss where the carrying amount exceeds the recoverable amount.
    build_note: Cost less impairment in almost all cases.
    requirement: |-
      Disclose the measurement basis for investments in subsidiaries, joint ventures and associates in separate financial statements - at cost, in accordance with FRS 109, or using the equity method - and any impairment recognised.
  - ref: F27-01
    output_form: Narrative paragraph
    tick_state: manual
    tb_keys:
    - investments
    wording: |-
      The Company is a wholly owned subsidiary of {PARENT}, incorporated in {COUNTRY}, which is also the Company's ultimate holding company. Consolidated financial statements have not been prepared as the Company is itself a wholly owned subsidiary. Consolidated financial statements complying with Financial Reporting Standards are prepared by the holding company and are available to the public at {ADDRESS}.
    build_note: Relevant where the client is an intermediate holding company.
    requirement: |-
      Where a parent is exempt from preparing consolidated financial statements, disclose that fact, the reason, and the name and address of the parent that produces consolidated financial statements.
  - ref: F27-02
    output_form: Table
    tick_state: manual
    tb_keys:
    - investments
    wording: |-
      Name of entity | Country of incorporation | Principal activity | Proportion of ownership interest
    build_note: 'Table shape: name, country, principal activity, holding percentage.'
    requirement: |-
      List significant investments in subsidiaries, joint ventures and associates, including name, principal place of business and proportion of ownership.
- key: inventories
  heading: Inventories
  tick_state: tb_driven
  trigger_keys:
  - inventories
  pieces:
  - ref: F2-01
    output_form: Narrative paragraph
    tick_state: tb_driven
    tb_keys:
    - inventories
    wording: |-
      Inventories are stated at the lower of cost and net realisable value. The cost incurred in bringing inventories to their present location and condition is accounted for as follows: raw materials, at purchase cost on a weighted average basis; and finished goods and work in progress, at the cost of direct materials and labour together with a proportion of manufacturing overheads based on normal operating capacity, assigned on a weighted average basis. Where necessary, an allowance is made for damaged, obsolete and slow-moving items to reduce the carrying value of inventories to the lower of cost and net realisable value. Net realisable value is the estimated selling price in the ordinary course of business, less the estimated costs of completion and the estimated costs necessary to make the sale.
    build_note: FIFO or weighted average; must be selectable per client.
    requirement: Disclose the accounting policy for inventories, including the cost formula used.
  - ref: F2-02
    output_form: Table
    tick_state: tb_driven
    tb_keys:
    - inventories
    wording: Raw materials | Work in progress | Finished goods | Total inventories
    build_note: 'Table shape: raw materials, WIP, finished goods.'
    requirement: |-
      Disclose the total carrying amount of inventories and the amounts held in classifications appropriate to the entity.
  - ref: F2-03
    output_form: Figure in note
    tick_state: tb_driven
    wording: Inventories recognised as an expense in cost of sales
    build_note: Usually equals cost of sales; confirm mapping.
    requirement: Disclose the amount of inventories recognised as an expense during the period.
  - ref: F2-04
    output_form: Figure in note
    tick_state: tb_driven
    tb_keys:
    - inventories
    wording: |-
      Allowance for inventory obsolescence: at 1 January, charge for the year, written off, at 31 December
    build_note: Suppress where no provision account movement.
    requirement: |-
      Disclose write-downs of inventories, any reversals, and the circumstances leading to them.
  - ref: F2-06
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - inventories
    wording: Inventories carried at fair value less costs to sell
    build_note: Rare outside commodity broker-traders.
    requirement: |-
      Disclose the carrying amount of inventories carried at fair value less costs to sell.
- key: provisions
  heading: Provisions
  tick_state: tb_driven
  trigger_keys:
  - provisions
  pieces:
  - ref: F37-06
    output_form: Narrative paragraph
    tick_state: tb_driven
    tb_keys:
    - provisions
    wording: |-
      Provisions are recognised when the Company has a present obligation, legal or constructive, as a result of a past event, it is probable that an outflow of resources embodying economic benefits will be required to settle the obligation, and the amount of the obligation can be estimated reliably. Provisions are reviewed at the end of each reporting period and adjusted to reflect the current best estimate. Where it is no longer probable that an outflow will be required, the provision is reversed. Where the effect of the time value of money is material, provisions are discounted using a current pre-tax rate that reflects, where appropriate, the risks specific to the liability, and the increase in the provision arising from the passage of time is recognised as a finance cost.
    build_note: Policy sub-section. Observed practice pairs this with a named provision such as reinstatement
      cost.
    requirement: |-
      Disclose the policy for recognising provisions, being the criteria for recognition, the basis of measurement, the requirement to review at each reporting date, and the treatment where the effect of discounting is material.
  - ref: F37-01
    output_form: Table
    tick_state: tb_driven
    tb_keys:
    - provisions
    wording: |-
      At 1 January | Provision made during the year | Amounts utilised | Unused amounts reversed | At 31 December
    build_note: Table shape by class of provision.
    requirement: |-
      For each class of provision, provide a reconciliation showing opening balance, additions, amounts used, unused amounts reversed and closing balance.
  - ref: F37-02
    output_form: Narrative paragraph
    tick_state: tb_driven
    tb_keys:
    - provisions
    wording: |-
      The provision for reinstatement cost represents the estimated cost of restoring the Company's leased premises to their original condition at the end of the lease term, as required by the terms of the lease agreements. The obligation is expected to be settled at the expiry of the respective leases. The amount recognised is management's best estimate of the expenditure required, and is subject to uncertainty as to the eventual condition of the premises and the cost of restoration work at the time it is carried out.
    build_note: Narrative paragraph per class.
    requirement: |-
      For each class of provision, describe the nature of the obligation, the expected timing of outflows, and the uncertainties involved.
  - ref: F37-05
    output_form: Figure in note
    tick_state: manual
    wording: Reimbursement receivable recognised as an asset
    build_note: MANUAL.
    requirement: |-
      Disclose the amount of any expected reimbursement, and the asset recognised for it.
  - ref: F115-08
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - provisions
    wording: Provision for returns, refunds and warranties
    build_note: MANUAL.
    requirement: |-
      Disclose obligations for returns, refunds, warranties and other similar obligations.
- key: employee_benefit_costs
  heading: Employee benefit costs
  tick_state: tb_driven
  trigger_keys:
  - accruals
  pieces:
  - ref: F19-03
    output_form: Narrative paragraph
    tick_state: tb_driven
    tb_keys:
    - accruals
    wording: |-
      (a) Defined contribution plans. The Company makes contributions to the Central Provident Fund scheme in Singapore, a defined contribution pension scheme. Contributions to defined contribution pension schemes are recognised as an expense in the period in which the related service is performed. (b) Employee leave entitlement. Employee entitlements to annual leave are recognised as a liability when they accrue to employees. A liability is recognised for leave earned in respect of services rendered by employees up to the end of the reporting period, and for bonuses where the Company has a present legal or constructive obligation to pay and the amount can be estimated reliably.
    build_note: Suppress where no leave accrual is recognised.
    requirement: |-
      Disclose the policy for accrued leave and other short-term accumulating benefits.
  - ref: F19-01
    output_form: Figure in note
    tick_state: always
    tb_keys:
    - staff_salaries
    wording: Salaries and bonuses | Other benefits | Total employee benefit costs
    build_note: Staff cost breakdown table.
    requirement: |-
      Recognise and disclose short-term employee benefits, including the expense for the period.
  - ref: F19-02
    output_form: Figure in note
    tick_state: always
    tb_keys:
    - cpf
    wording: Contributions to Central Provident Fund
    build_note: Central Provident Fund contributions in a Singapore set.
    requirement: Disclose the amount recognised as an expense for defined contribution plans.
