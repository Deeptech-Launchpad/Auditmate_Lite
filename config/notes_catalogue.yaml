    build_note: MANUAL narrative.
    requirement: |-
      Explain how the transition to Financial Reporting Standards affected the reported financial position, financial performance and cash flows.
  - ref: F101-03
    output_form: Table
    tick_state: manual
    wording: |-
      Equity under the previous framework | Effect of transition | Equity under FRS | Total comprehensive income under the previous framework | Effect of transition | Total comprehensive income under FRS
    build_note: 'Table shape: line item, previous GAAP, adjustment, FRS.'
    requirement: |-
      Provide reconciliations of equity and of total comprehensive income between the previous framework and Financial Reporting Standards, for the date of transition and the comparative period.
