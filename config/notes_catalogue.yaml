- key: fair_value_measurement
  heading: Fair value measurement
  tick_state: tb_driven
  trigger_keys:
  - cash_and_equivalents
  - investments
  - long_term_borrowings
  - trade_receivables
  pieces:
  - ref: F113-01
    output_form: Narrative paragraph
    tick_state: tb_driven
    tb_keys:
    - investments
    wording: |-
      Fair value is the price that would be received to sell an asset, or paid to transfer a liability, in an orderly transaction between market participants at the measurement date. Where an asset or liability is measured or disclosed at fair value, the measurement assumes that the transaction takes place in the principal market for the asset or liability, or in the absence of a principal market, in the most advantageous market to which the Company has access.
    build_note: Policy paragraph. Applies wherever any item is measured or disclosed at fair value.
    requirement: |-
      Disclose the policy for measuring fair value as the price that would be received to sell an asset or paid to transfer a liability in an orderly transaction between market participants at the measurement date.
  - ref: F113-02
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - investments
    wording: Level 1 | Level 2 | Level 3 | Total fair value
    build_note: Levels 1, 2 and 3. Rare where all instruments are at amortised cost.
    requirement: |-
      For each class of asset and liability measured at fair value, disclose the fair value at the reporting date and the level of the fair value hierarchy within which it falls.
  - ref: F113-03
    output_form: Narrative paragraph
    tick_state: manual
    tb_keys:
    - investments
    wording: |-
      The fair value of the Company's financial assets and financial liabilities not measured at fair value has been determined using a discounted cash flow technique. The significant input is the discount rate, which is derived from observable market rates for instruments with similar terms and credit risk. There was no change in the valuation technique applied during the financial year.
    build_note: Most SME fair values are Level 2 or 3, so this bites where it applies at all.
    requirement: |-
      For Level 2 and Level 3 measurements, describe the valuation techniques and inputs used, and any change in technique with the reason for it.
  - ref: F113-04
    output_form: Table
    tick_state: manual
    tb_keys:
    - investments
    wording: |-
      At 1 January | Total gains or losses | Purchases | Sales | Transfers | At 31 December
    build_note: MANUAL.
    requirement: |-
      For recurring Level 3 measurements, provide a reconciliation from opening to closing balances, showing gains and losses, purchases, sales and transfers.
  - ref: F113-05
    output_form: Narrative paragraph
    tick_state: manual
    tb_keys:
    - investments
    wording: |-
      Fair value measurements falling within Level 3 of the fair value hierarchy are determined by management and reviewed by the directors at the end of each reporting period. An increase in the discount rate applied would result in a lower fair value measurement, and a decrease would result in a higher fair value measurement.
    build_note: MANUAL.
    requirement: |-
      For recurring Level 3 measurements, describe the valuation processes used and provide a narrative sensitivity analysis to changes in unobservable inputs.
  - ref: F113-06
    output_form: Figure in note
    tick_state: tb_driven
    tb_keys:
    - trade_receivables
    - cash_and_equivalents
    - long_term_borrowings
    wording: Carrying amount | Fair value | Level within the fair value hierarchy
    build_note: Applies alongside FRS 107 para 25. Commonly overlooked in SME sets.
    requirement: |-
      For assets and liabilities not measured at fair value but whose fair value is disclosed, disclose the level of the fair value hierarchy and, for Level 2 and Level 3, the valuation technique and inputs.
  - ref: F113-07
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - investments
    wording: |-
      Valuation technique | Significant inputs | Effect on profit or loss of recurring Level 3 measurements
    build_note: Umbrella objective; drives the paragraphs above.
    requirement: |-
      Disclose information helping users assess the valuation techniques and inputs used, and the effect on profit or loss of recurring Level 3 measurements.
