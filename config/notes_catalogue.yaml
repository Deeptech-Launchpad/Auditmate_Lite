    tick_state: tb_driven
    tb_keys:
    - retained_earnings
    wording: |-
      The retained earnings reserve comprises the cumulative profits of the Company that have not been distributed to shareholders. It is available for distribution to shareholders subject to the Company being able to pay its debts as they fall due.
    build_note: Suppress where only share capital and retained earnings are present.
    requirement: Describe the nature and purpose of each reserve within equity.
