    output_form: Table
    tick_state: tb_driven
    tb_keys:
    - deferred_tax
    wording: |-
      At the beginning of the year | Charged or credited to profit or loss | At the end of the year
    build_note: 'Table shape: opening, charge to P&L, closing, by category.'
    requirement: |-
      Disclose the amount of deferred tax assets and liabilities recognised, analysed by type of temporary difference.
  - ref: F12-04
    output_form: Figure in note
    tick_state: tb_driven
