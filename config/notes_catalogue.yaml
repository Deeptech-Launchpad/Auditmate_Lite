      Unutilised tax losses | Unabsorbed capital allowances | Deductible temporary differences
    build_note: Not derivable from TB. Requires a tax computation input field.
    requirement: |-
      Disclose deductible temporary differences and unused tax losses for which no deferred tax asset is recognised, with expiry dates where applicable.
  - ref: F12-06
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - investments
