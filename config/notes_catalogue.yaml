- key: financial_risk_management_objectives_and_policies
  heading: Financial risk management objectives and policies
  tick_state: always
  pieces:
  - ref: F107-23
    output_form: Figure in note
    tick_state: always
    wording: |-
      The Company is exposed to financial risks arising from its operations and its use of financial instruments. The key financial risks are credit risk, liquidity risk, foreign currency risk and interest rate risk. The directors review and agree the policies and procedures for managing each of these risks. There has been no change to the Company's exposure to these risks, or to the manner in which it manages and measures them, during the financial year.
    build_note: Container note. Carries an introductory paragraph naming the risks; the individual risk
      disclosures sit under it as sub-sections.
    requirement: |-
      Disclose information that enables users of the financial statements to evaluate the nature and extent of risks arising from financial instruments to which the entity is exposed at the end of the reporting period.
  subsections:
  - key: credit_risk
    heading: Credit risk
    tick_state: always
    pieces:
    - ref: F107-08
      output_form: Narrative paragraph
      tick_state: always
      tb_keys:
      - trade_receivables
      wording: |-
        The Company applies the simplified approach permitted under FRS 109 in measuring expected credit losses on trade receivables, recognising a loss allowance equal to lifetime expected credit losses at each reporting date. The allowance is estimated using a provision matrix based on the Company's historical credit loss experience for each ageing band, adjusted for forward-looking information about the specific debtors and the economic conditions in which they operate. For other financial assets measured at amortised cost, the loss allowance is measured at an amount equal to twelve-month expected credit losses, unless credit risk has increased significantly since initial recognition, in which case lifetime expected credit losses are recognised. A financial asset is written off when there is no reasonable expectation of recovering the balance.
      build_note: Materially wider than SFRS for SE. Major gap in the SE-derived index.
      requirement: |-
        Explain the inputs, assumptions and estimation techniques used to measure expected credit losses, including how forward-looking information is incorporated.
    - ref: F107-07
      output_form: Figure in note
      tick_state: always
      tb_keys:
      - trade_receivables
      wording: |-
        Maximum exposure to credit risk | Trade receivables | Other receivables | Cash and bank balances
      build_note: Core credit risk note.
      requirement: |-
        Disclose information about credit risk exposure, including the maximum exposure to credit risk at the reporting date and how credit risk is managed.
    - ref: F107-10
      output_form: Figure in note
      tick_state: always
      wording: |-
        Current | 1 to 30 days past due | 31 to 60 days | 61 to 90 days | More than 90 days | Gross carrying amount | Expected loss rate | Loss allowance
      build_note: Provision matrix table. Ageing buckets must be a TB or ledger input.
      requirement: |-
        Disclose credit risk exposure by credit risk rating grade, or by ageing where a provision matrix is used.
    - ref: F107-11
      output_form: Figure in note
      tick_state: manual
      wording: Collateral held as security | Fair value of collateral
      build_note: MANUAL.
      requirement: |-
        Disclose collateral held as security and other credit enhancements, and their financial effect.
  - key: liquidity_risk
    heading: Liquidity risk
    tick_state: always
    pieces:
    - ref: F107-12
      output_form: Table
      tick_state: always
      tb_keys:
      - long_term_borrowings
      - short_term_borrowings
      wording: |-
        Within 1 year | 1 to 5 years | More than 5 years | Total undiscounted contractual cash flows | Carrying amount
      build_note: 'Table shape: within 1 year, 1-5 years, over 5 years. Needs maturity attribute.'
      requirement: |-
        Provide a maturity analysis of financial liabilities showing the remaining contractual maturities on an undiscounted basis.
    - ref: F107-13
      output_form: Narrative paragraph
      tick_state: always
      wording: |-
        The Company manages liquidity risk by monitoring forecast and actual cash flows and by maintaining sufficient cash and bank balances to meet its obligations as they fall due. The directors are satisfied that the Company has adequate resources to meet its liabilities as they fall due for at least twelve months from the end of the reporting period.
      build_note: Narrative paragraph.
      requirement: Describe how liquidity risk inherent in financial liabilities is managed.
  - key: foreign_currency_risk
    heading: Foreign currency risk
    tick_state: tb_driven
    pieces:
    - ref: F107-15
      output_form: Figure in note
      tick_state: tb_driven
      wording: |-
        Exposure by currency | Effect on profit before tax of a reasonably possible strengthening or weakening
      build_note: 'PREREQUISITE: currency attribute on TB accounts to auto-populate.'
      requirement: |-
        Provide a sensitivity analysis for foreign currency risk, disclosing exposures by currency and the effect of reasonably possible movements.
  - key: interest_rate_risk
    heading: Interest rate risk
    tick_state: tb_driven
    trigger_keys:
    - long_term_borrowings
    - short_term_borrowings
    pieces:
    - ref: F107-14
      output_form: Figure in note
      tick_state: tb_driven
      tb_keys:
      - long_term_borrowings
      - short_term_borrowings
      wording: Effect on profit before tax of a reasonably possible change in interest rates
      build_note: Suppress where all borrowings are fixed rate or none exist.
      requirement: |-
        Provide a sensitivity analysis for interest rate risk showing the effect on profit or loss and equity of reasonably possible changes in interest rates.
  - key: concentration_of_risk
