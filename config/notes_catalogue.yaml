    output_form: Narrative paragraph
    tick_state: always
    wording: |-
      A related party is a person, or a close member of that person's family, who has control or joint control over the Company, has significant influence over it, or is a member of its key management personnel or of that of a parent; or an entity that is a member of the same group, an associate or joint venture of the Company or of a group member, controlled or jointly controlled by such a person, or over which such a person has significant influence.
    build_note: Policy sub-section. Observed practice reproduces the definition in full; a short form
      is acceptable.
    requirement: |-
      Disclose the definition of a related party applied by the entity, covering both persons and entities.
  - ref: F24-01
    output_form: Figure in note
    tick_state: always
    wording: Immediate holding company | Ultimate holding company | Country of incorporation
    build_note: Always required if a parent exists, even with no transactions.
