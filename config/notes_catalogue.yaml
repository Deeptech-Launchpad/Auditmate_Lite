- key: related_party_transactions
  heading: Related party transactions
  tick_state: tb_driven
  pieces:
  - ref: F24-06
    output_form: Narrative paragraph
    tick_state: tb_driven
    wording: |-
      Include the following sentence only where equivalence to arm's length terms can actually be substantiated: "The terms of the above transactions are equivalent to those that prevail in arm's length transactions." Where equivalence cannot be demonstrated, omit the sentence and describe the terms factually instead.
    build_note: Guard this paragraph. Common boilerplate error in SME sets.
    requirement: |-
      Only state that related party transactions were made on terms equivalent to arm's length transactions where those terms can be substantiated.
  - ref: F24-03
    output_form: Narrative + table
    tick_state: always
    wording: |-
      The following significant transactions took place between the Company and its related parties during the financial year, on terms agreed between the parties. Outstanding balances at the end of the reporting period are unsecured, interest free and repayable on demand, and settlement is expected to be made in cash. No guarantees have been given or received in respect of these balances.
    build_note: 'Table shape: transactions and balances by category.'
    requirement: |-
      For each category of related party, disclose the nature of the relationship, the amount of transactions, outstanding balances, their terms and conditions, and any guarantees given or received.
