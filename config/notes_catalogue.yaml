    output_form: Narrative paragraph
    tick_state: manual
    tb_keys:
    - long_term_borrowings
    - short_term_borrowings
    wording: |-
      Where the terms of a financial liability are modified and the modification is not substantial, the carrying amount of the liability is recalculated by discounting the modified contractual cash flows at the original effective interest rate, and the resulting adjustment is recognised in profit or loss. Where the modification is substantial, the original financial liability is derecognised and a new financial liability is recognised at fair value.
    build_note: MANUAL.
    requirement: |-
      Disclose the treatment of modifications to financial liabilities that do not result in derecognition.
  - ref: F1-23
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - long_term_borrowings
    - short_term_borrowings
    wording: Non-current liabilities subject to covenants
    build_note: MANUAL. See FRS PS 2 paras 81-83 for the materiality test.
    requirement: |-
      Where non-current liabilities are subject to covenants, disclose information enabling users to understand the risk that they could become repayable within twelve months.
  - ref: F107-19
    output_form: Figure in note
    tick_state: manual
    tb_keys:
    - long_term_borrowings
    - short_term_borrowings
    wording: |-
      Amount in default | Terms breached | Whether remedied before the financial statements were authorised for issue
    build_note: MANUAL.
