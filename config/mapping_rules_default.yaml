- {pattern: "standard chartered",   statement: balance_sheet, line: cash_and_equivalents, priority: 12}

# Payable and deposit wording that the salary and rent rules would otherwise
# take, because a payable is a liability and a deposit is an asset.
- {pattern: "wages payable",        statement: balance_sheet, line: accruals, priority: 3, sign: -1}
- {pattern: "salaries payable",     statement: balance_sheet, line: accruals, priority: 3, sign: -1}
- {pattern: "salary payable",       statement: balance_sheet, line: accruals, priority: 3, sign: -1}
- {pattern: "rental deposit",       statement: balance_sheet, line: prepayments, priority: 4}
- {pattern: "rent deposit",         statement: balance_sheet, line: prepayments, priority: 4}
- {pattern: "utility deposit",      statement: balance_sheet, line: prepayments, priority: 4}
- {pattern: "loan from third part",  statement: balance_sheet, line: trade_payables, priority: 4, sign: -1}
- {pattern: "loan from 3rd part",   statement: balance_sheet, line: trade_payables, priority: 4, sign: -1}
- {pattern: "loan given to employee", statement: balance_sheet, line: prepayments, priority: 4}

# "Computer Expenses" is spending, not a computer; the asset rule above would
# otherwise capitalise it. Same idea for GST shown on a profit and loss.
- {pattern: "computer expense",     statement: profit_and_loss, line: other_expenses, priority: 6}
- {pattern: "gst (p&l)",            statement: profit_and_loss, line: gst_payables_expense, priority: 4}
- {pattern: "gst expense",          statement: profit_and_loss, line: gst_payables_expense, priority: 5}

# The last eight from the Dynamic Electrical FY2024 trial balance. Each agreed
# with the client's own statement to the cent and still reached no line, so it
# would have printed in nothing.
- {pattern: "staff amenit",         statement: profit_and_loss, line: other_expenses, priority: 12}
- {pattern: "power, water",         statement: profit_and_loss, line: other_expenses, priority: 12}
- {pattern: "water & gas",          statement: profit_and_loss, line: other_expenses, priority: 12}
- {pattern: "stationery",           statement: profit_and_loss, line: other_expenses, priority: 12}
- {pattern: "printing",             statement: profit_and_loss, line: other_expenses, priority: 13}
- {pattern: "office expense",       statement: profit_and_loss, line: other_expenses, priority: 10}
- {pattern: "bookkeeping",          statement: profit_and_loss, line: accounting_charges, priority: 6}
- {pattern: "site inspection",      statement: profit_and_loss, line: other_expenses, priority: 12}
- {pattern: "medical",              statement: profit_and_loss, line: other_expenses, priority: 14}

# GST standing on a balance sheet is money owed to IRAS. Priority is set well
# below "gst payable" and "gst (p&l)" so those keep their sharper meaning.
- {pattern: "gst",                  statement: balance_sheet, line: trade_payables, priority: 25, sign: -1}

