# --- Xero's default chart of accounts ---------------------------------------
# A new Xero organisation ships with these account names, so most Xero pulls
# will contain them verbatim. Mapping them here means a first pull lands
# largely mapped instead of leaving the auditor a page of amber rows.
- {pattern: "advertising",          statement: profit_and_loss, line: other_expenses, priority: 14}
- {pattern: "general expenses",     statement: profit_and_loss, line: other_expenses, priority: 20}
- {pattern: "light, power",         statement: profit_and_loss, line: other_expenses, priority: 14}
- {pattern: "subscriptions",        statement: profit_and_loss, line: other_expenses, priority: 14}
- {pattern: "computer equipment",   statement: balance_sheet, line: ppe, priority: 8}
- {pattern: "office equipment",     statement: balance_sheet, line: ppe, priority: 8}
- {pattern: "cost of goods sold",   statement: profit_and_loss, line: purchases, priority: 8}
- {pattern: "business bank account", statement: balance_sheet, line: cash_and_equivalents, priority: 8}
- {pattern: "accounts receivable",  statement: balance_sheet, line: trade_receivables, priority: 8}
- {pattern: "accounts payable",     statement: balance_sheet, line: trade_payables, priority: 8, sign: -1}
- {pattern: "superannuation",       statement: profit_and_loss, line: cpf, priority: 10}
- {pattern: "other revenue",        statement: profit_and_loss, line: other_income, priority: 10, sign: -1}

# --- gaps found testing a real Singapore SME's management accounts ----------
# Lower priority number wins. These sit BELOW the generic rules they need to
# beat: "Loan from Director" was being claimed by the catch-all "director"
# rule (priority 5) and booked as director's remuneration - an expense -
# when it is a liability owed to him.
- {pattern: "loan from director",   statement: balance_sheet, line: short_term_borrowings, priority: 2, sign: -1}
- {pattern: "loan to director",     statement: balance_sheet, line: prepayments, priority: 2}
- {pattern: "repayment of loan",    statement: balance_sheet, line: short_term_borrowings, priority: 3, sign: -1}
- {pattern: "loan to 3rd part",     statement: balance_sheet, line: prepayments, priority: 3}
- {pattern: "loan to third part",   statement: balance_sheet, line: prepayments, priority: 3}
- {pattern: "staff loan",           statement: balance_sheet, line: prepayments, priority: 3}
- {pattern: "loan to employee",     statement: balance_sheet, line: prepayments, priority: 3}
- {pattern: "amount due from",      statement: balance_sheet, line: prepayments, priority: 6}

# "Bank 1 Charg" is not matched by "bank charge", so only the catch-all
# "bank" (priority 30, cash) claimed it - putting a bank fee into cash.
- {pattern: "charg",                statement: profit_and_loss, line: bank_charges, priority: 14}
- {pattern: "loan interest",        statement: profit_and_loss, line: interest_expense, priority: 4}
- {pattern: "interest on loan",     statement: profit_and_loss, line: interest_expense, priority: 4}

- {pattern: "cost of service",      statement: profit_and_loss, line: service_charges, priority: 6}
- {pattern: "cost of good",         statement: profit_and_loss, line: purchases, priority: 6}
- {pattern: "exp claim",            statement: profit_and_loss, line: other_expenses, priority: 12}
- {pattern: "expense claim",        statement: profit_and_loss, line: other_expenses, priority: 12}
- {pattern: "gst payment",          statement: profit_and_loss, line: gst_payables_expense, priority: 6}
- {pattern: "income tax payment",   statement: profit_and_loss, line: tax_expense, priority: 6}
- {pattern: "laptop",               statement: balance_sheet, line: ppe, priority: 8}
- {pattern: "computer",             statement: balance_sheet, line: ppe, priority: 8}
- {pattern: "furniture",            statement: balance_sheet, line: ppe, priority: 8}
- {pattern: "asset ",               statement: balance_sheet, line: ppe, priority: 20}

# --------------------------------------------- Singapore SME account names ---
# Wording seen on real engagements that the rules above did not reach, so the
# accounts arrived unmapped and contributed to no statement. Each is narrow
# enough to mean only one thing, and priority is set low where a broader rule
# above would otherwise claim it first - "Bank Fees" is a charge, not cash,
# and "Salaries and wages payable" is an accrual, not salary cost.
- {pattern: "contractor",           statement: profit_and_loss, line: manpower_supply, priority: 8}
- {pattern: "subcontractor",        statement: profit_and_loss, line: manpower_supply, priority: 7}
- {pattern: "sub-contractor",       statement: profit_and_loss, line: manpower_supply, priority: 7}
- {pattern: "consultanc",           statement: profit_and_loss, line: consulting_fee, priority: 10}
- {pattern: "auditor",              statement: profit_and_loss, line: accounting_charges, priority: 6}
- {pattern: "audit and tax",        statement: profit_and_loss, line: accounting_charges, priority: 5}
- {pattern: "tax fee",              statement: profit_and_loss, line: accounting_charges, priority: 8}
- {pattern: "bank fee",             statement: profit_and_loss, line: bank_charges, priority: 4}
- {pattern: "levy",                 statement: profit_and_loss, line: mom_application_fee, priority: 8}
- {pattern: "mom fee",              statement: profit_and_loss, line: mom_application_fee, priority: 6}
- {pattern: "foreign worker",       statement: profit_and_loss, line: mom_application_fee, priority: 6}
- {pattern: "software",             statement: profit_and_loss, line: other_expenses, priority: 14}
- {pattern: "repairs",              statement: profit_and_loss, line: other_expenses, priority: 14}
- {pattern: "maintenance",          statement: profit_and_loss, line: other_expenses, priority: 15}
- {pattern: "transport",            statement: profit_and_loss, line: other_expenses, priority: 14}
- {pattern: "refreshment",          statement: profit_and_loss, line: other_expenses, priority: 14}
- {pattern: "food expense",         statement: profit_and_loss, line: other_expenses, priority: 14}
- {pattern: "rental of equipment",  statement: profit_and_loss, line: other_expenses, priority: 10}

