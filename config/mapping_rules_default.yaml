# Seed rules: account label -> statement line.
#
# These run before any AI call. Anything matched here costs nothing and is
# deterministic. Labels that match nothing go to the AI classifier (if a key
# is configured) and then to the auditor's "Unmapped items" tray.
#
# match: contains (default) | exact | regex     — case-insensitive
# sign:  1 keeps the amount, -1 flips it (e.g. contra accounts)
# Lower priority number wins when several rules match.

# ---------------------------------------------------------------- income ---
- {pattern: "revenue",              statement: profit_and_loss, line: revenue, priority: 10, sign: -1}
- {pattern: "sales",                statement: profit_and_loss, line: revenue, priority: 15, sign: -1}
- {pattern: "turnover",             statement: profit_and_loss, line: revenue, priority: 10, sign: -1}
- {pattern: "fee income",           statement: profit_and_loss, line: revenue, priority: 10, sign: -1}
- {pattern: "service income",       statement: profit_and_loss, line: revenue, priority: 10, sign: -1}
- {pattern: "other income",         statement: profit_and_loss, line: other_income, priority: 10}
- {pattern: "interest income",      statement: profit_and_loss, line: interest_income, priority: 10}

