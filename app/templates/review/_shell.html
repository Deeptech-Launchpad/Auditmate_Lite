<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Auditmate{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <style>
    body { background: #eef0f3; display: grid; place-items: center; min-height: 100vh; }
    .panel {
      background: #fff; border-radius: 10px; padding: 40px 44px; max-width: 520px;
      width: 100%; margin: 20px; box-shadow: 0 2px 14px rgba(0,0,0,.09);
      text-align: center;
    }
    .panel .mark { font-size: 40px; margin-bottom: 14px; }
    .panel h1 { font-size: 20px; margin-bottom: 10px; }
    .panel p { color: var(--text-muted); font-size: 13.5px; line-height: 1.65; }
    .brandline { color: var(--text-faint); font-size: 12px; margin-top: 22px; }
  </style>
</head>
<body>
  <div class="panel">{% block panel %}{% endblock %}</div>
</body>
</html>
