<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Auditmate</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="logo-row">
      <span class="logo-mark">A</span>
      <h1>Auditmate</h1>
    </div>
    <p class="sub">Audit management for Singapore engagements</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flashes">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}"><span>{{ message }}</span></div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" value="{{ email }}"
               required autofocus autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               required autocomplete="current-password">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember" style="font-weight:400">Keep me signed in</label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg">Sign in</button>
    </form>

    <p class="login-foot">
      AltiusNXT &middot; Audit Management
    </p>
  </div>
</div>
</body>
</html>
